services:
  - type: web
    name: calculautorent-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: calculautorent-frontend
    env: static
    rootDir: frontend
    buildCommand: corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
